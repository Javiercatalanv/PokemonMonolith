name: CI Pipeline - PokemonMonolith

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    name: Backend Tests & Coverage (Min 60%)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Linter con Ruff
        run: |
          ruff check .

      - name: Ejecutar Tests con Verificacion de Cobertura (Min 60%)
        run: |
          pytest --cov=app --cov=seeder --cov-report=term-missing --cov-report=xml --cov-fail-under=60

      - name: Subir reporte de Cobertura como Artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  docker-build:
    name: Dockerize Backend Verification
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen Docker del Backend
        run: |
          docker build -t pokemon-backend:latest .

  frontend-build:
    name: Frontend Angular Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del Frontend
        working-directory: frontend
        run: npm ci

      - name: Compilar Frontend (Build de Produccion)
        working-directory: frontend
        run: npm run build
