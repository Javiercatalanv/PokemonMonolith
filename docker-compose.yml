# Docker Compose para PokemonMonolith: Base de Datos y Backend Dockerizado
#
#   docker compose up -d              # Levantar base de datos y backend FastAPI
#   docker compose ps                 # Ver estado de los contenedores
#   docker compose logs -f backend    # Ver logs del backend en tiempo real
#   docker compose run --rm seeder    # Ejecutar ingesta de datos dentro del contenedor
#   docker compose down               # Detener conservando los datos
#   docker compose down -v            # Detener y BORRAR los datos
#
# Si prefieres correr el backend directamente en tu maquina (desarrollo local):
#   docker compose up -d db           # Levanta solo PostgreSQL
#   .venv/bin/uvicorn app.main:app    # Se conecta a localhost:5435

services:
  db:
    image: postgres:16-alpine
    container_name: pokemon_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-newmonoliopokemon}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      # Publicado en el puerto 5435 del host (5432 dentro de la red interna de Docker)
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-newmonoliopokemon}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - pokemon_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pokemon_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-newmonoliopokemon}
      - ENVIRONMENT=local
      - DEBUG=true
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=http://localhost:3000,http://localhost:4200,http://localhost:5173
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - pokemon_network

  seeder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pokemon_seeder
    profiles: ["seeder"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-newmonoliopokemon}
    command: ["python", "-m", "seeder.seed", "--limit", "151"]
    networks:
      - pokemon_network

networks:
  pokemon_network:
    name: pokemon_network

volumes:
  postgres_data:
    name: pokemon_postgres_data
